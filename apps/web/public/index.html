<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人控制台 · 登录</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#26364d;background:#f2f6fb}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 36px));background:white;border:1px solid #dfe7f0;border-radius:20px;box-shadow:0 16px 42px #244b761c;padding:32px}h1{font-size:24px;margin:0 0 7px}p{color:#718096;line-height:1.6}label{display:block;font-size:13px;color:#536479;margin:18px 0 7px}input{box-sizing:border-box;width:100%;height:42px;border:1px solid #cfd9e5;border-radius:10px;padding:0 12px;font-size:15px}button{width:100%;height:44px;margin-top:22px;border:0;border-radius:11px;background:#356fd4;color:white;font-size:15px;cursor:pointer}#error{color:#b33b4a;min-height:1.4em;font-size:13px}</style></head><body><main class="card"><h1>机器人控制台</h1><p>登录后进入控制台。机器人连接和安全停止由后端与机器人端协议共同负责。</p><form id="login"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><div id="error" role="alert"></div><button>登录</button></form></main><script>fetch('/api/auth/me').then(r=>{if(r.ok)location.href='/console.html'});document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button'),err=document.querySelector('#error');b.disabled=true;err.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const j=await r.json();if(!r.ok)throw new Error(j.msg||'登录失败');location.href='/console.html'}catch(x){err.textContent=x.message}finally{b.disabled=false}});</script></body></html>
