<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人员管理 · 机器人控制台</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#26364d;background:#f2f6fb}body{margin:0}.wrap{max-width:960px;margin:36px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #dfe7f0;border-radius:16px;padding:22px;margin-top:20px}h1{margin:0;font-size:25px}h2{font-size:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e8eef5;font-size:14px}input,select{height:36px;border:1px solid #cfd9e5;border-radius:8px;padding:0 9px;margin:4px 3px}button{border:0;border-radius:8px;padding:9px 13px;background:#356fd4;color:white;cursor:pointer}button.secondary{background:#75849a}.error{color:#b33b4a;min-height:1.4em}</style></head><body><main class="wrap"><div class="top"><div><h1>人员管理</h1><p>管理员可以创建、停用和调整控制台人员。</p></div><div><a href="/console.html">回控制台</a> <button id="logout" class="secondary">退出</button></div></div><section class="card"><h2>新增人员</h2><form id="create"><input id="email" type="email" placeholder="邮箱" required><input id="displayName" placeholder="姓名" required><input id="password" type="password" minlength="12" placeholder="初始密码（至少 12 位）" required><select id="role"><option value="operator">操作员</option><option value="viewer">只读</option><option value="admin">管理员</option></select><button>创建</button><div id="error" class="error"></div></form></section><section class="card"><h2>现有人员</h2><table><thead><tr><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const roleName={admin:'管理员',operator:'操作员',viewer:'只读'};const escapeHtml=value=>{const element=document.createElement('span');element.textContent=String(value);return element.innerHTML};async function api(url,opt){const r=await fetch(url,{headers:{'content-type':'application/json'},...opt});const j=await r.json();if(!r.ok)throw Error(j.msg||'请求失败');return j}async function load(){try{const j=await api('/api/users');document.querySelector('#rows').innerHTML=j.data.users.map(u=>`<tr><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.displayName)}</td><td>${roleName[u.role]}</td><td>${u.enabled?'启用':'停用'}</td><td><button data-id="${u.id}" data-enabled="${u.enabled}">${u.enabled?'停用':'启用'}</button></td></tr>`).join('')}catch(e){location.href='/'}}document.querySelector('#rows').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;await api('/api/users/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.enabled!=='true'})});load()});document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();document.querySelector('#error').textContent='';try{await api('/api/users',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,displayName:document.querySelector('#displayName').value,password:document.querySelector('#password').value,role:document.querySelector('#role').value})});e.target.reset();load()}catch(x){document.querySelector('#error').textContent=x.message}});document.querySelector('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/'};load();</script></body></html>
