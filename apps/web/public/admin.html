<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>人员管理 · 机器人控制台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#202630;background:#f4f6f9;--blue:#087cf0;--line:rgba(54,72,104,.09);--muted:#7b8797}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 5% 10%,rgba(215,231,254,.46),transparent 40%),radial-gradient(ellipse at 97% 30%,rgba(226,221,247,.32),transparent 38%),linear-gradient(145deg,#f7f9fc,#f1f3f7);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(0,122,255,.35);outline-offset:2px}
.admin-shell{max-width:1180px;margin:0 auto;padding:0 30px 42px}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid #fff;border-radius:13px;background:#fff;box-shadow:0 3px 12px rgba(41,76,131,.09);color:var(--blue);font-size:13px;font-weight:750;letter-spacing:.5px}.brand-name{font-size:16px;font-weight:680}.brand-sub{margin-top:4px;color:#939aa6;font-size:10px;letter-spacing:2px}.top-actions{display:flex;align-items:center;gap:12px}.back-link{display:inline-flex;align-items:center;height:35px;padding:0 12px;border-radius:10px;color:#69788d;background:rgba(255,255,255,.65);font-size:12px;text-decoration:none}.back-link:hover{background:#fff;color:var(--blue)}.account-slot{min-width:38px;min-height:38px}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:32px 0 22px}.page-heading h1{margin:0 0 8px;font-size:29px;letter-spacing:-.8px;font-weight:670}.page-heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.error{min-height:1.5em;color:#b33b4a;font-size:12px}
.card{margin-top:18px;padding:23px;border:1px solid rgba(255,255,255,.96);border-radius:21px;background:rgba(255,255,255,.82);box-shadow:0 8px 28px rgba(48,67,97,.045),0 1px 3px rgba(48,67,97,.025);backdrop-filter:blur(20px)}.card h2{margin:0 0 7px;font-size:17px;font-weight:650}.card-description{margin:0 0 18px;color:#8a96a6;font-size:11px;line-height:1.7}.create-form{display:grid;grid-template-columns:1.25fr 1fr 1.15fr .7fr auto;align-items:end;gap:10px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:11px;color:#798696}.field input,.field select{height:40px;width:100%;border:1px solid #e1e7ef;border-radius:10px;background:#fafbfd;padding:0 11px;color:#536379;font-size:12px}.field input:focus,.field select:focus{border-color:#88bdff;background:#fff}.primary,.secondary,.warn{height:40px;padding:0 14px;border:0;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}.primary{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(0,122,255,.16)}.secondary{background:#eef2f6;color:#657488}.warn{background:#fff0ef;color:#bd4a4e}.primary:hover,.secondary:hover,.warn:hover{filter:brightness(.98)}
.table-wrap{overflow:auto;border:1px solid #e8edf3;border-radius:13px}.table{width:100%;min-width:720px;border-collapse:collapse}.table th,.table td{padding:12px 13px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px;vertical-align:middle}.table th{background:#f7f9fb;color:#78879b;font-size:11px;font-weight:600}.table tr:last-child td{border-bottom:0}.table td{color:#506178}.table select{height:32px;border:1px solid #e0e7ef;border-radius:8px;background:#fbfcfd;padding:0 8px;color:#536479;font-size:12px}.actions{white-space:nowrap}.actions button{margin-right:5px}.audit-detail{max-width:450px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#718096}.status-enabled{color:#2b9a75}.status-disabled{color:#aa7a62}.empty{padding:20px;text-align:center;color:#96a1af;font-size:12px}
@media(max-width:900px){.admin-shell{padding:0 20px 35px}.create-form{grid-template-columns:repeat(2,1fr)}.create-form .submit-cell{grid-column:span 2}.page-heading{align-items:flex-start;flex-direction:column;gap:4px}}
@media(max-width:600px){.admin-shell{padding:0 14px 28px}.topbar{height:76px}.brand-mark{width:35px;height:35px;border-radius:11px}.brand-name{font-size:14px}.brand-sub{font-size:8px;letter-spacing:1.6px}.top-actions{gap:5px}.back-link{padding:0 8px;font-size:11px}.create-form{display:flex;flex-direction:column;align-items:stretch}.create-form .submit-cell{display:block}.card{padding:18px 15px;border-radius:17px}.page-heading{padding:25px 0 15px}.page-heading h1{font-size:26px}}
</style>
</head>
<body>
<main class="admin-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">ZK</div><div><div class="brand-name">机器人控制台</div><div class="brand-sub">ZK · ROBOT CONSOLE</div></div></div>
    <div class="top-actions"><a class="back-link" href="/console.html">回控制台</a><span class="account-slot" aria-label="账户菜单"></span></div>
  </header>
  <section class="page-heading"><div><h1>人员管理</h1><p>管理员可以创建、停用、调整角色和重置密码。至少保留一个启用中的管理员。</p></div></section>
  <p id="error" class="error" role="alert"></p>
  <section class="card">
    <h2>新增人员</h2>
    <p class="card-description">为新的操作人员设置登录邮箱、显示姓名和权限。</p>
    <form id="create" class="create-form">
      <div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="displayName">姓名</label><input id="displayName" autocomplete="name" required></div>
      <div class="field"><label for="password">初始密码</label><input id="password" type="password" minlength="12" placeholder="至少 12 位" required></div>
      <div class="field"><label for="role">角色</label><select id="role"><option value="operator">操作员</option><option value="viewer">只读</option><option value="admin">管理员</option></select></div>
      <div class="submit-cell"><button class="primary">创建人员</button></div>
    </form>
  </section>
  <section class="card">
    <h2>现有人员</h2>
    <p class="card-description">角色和启用状态会立即影响下一次登录与控制权限。</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <section class="card">
    <h2>最近审计记录</h2>
    <p class="card-description">记录登录、人员变更和机器人控制操作。</p>
    <div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>操作</th><th>详情</th></tr></thead><tbody id="audit"></tbody></table></div>
  </section>
</main>
<script>
'use strict';
const roleName={admin:'管理员',operator:'操作员',viewer:'只读'};
const escapeHtml=value=>{const element=document.createElement('span');element.textContent=String(value);return element.innerHTML};
async function api(url,opt={}){const r=await fetch(url,{headers:{'content-type':'application/json'},...opt});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.msg||'请求失败');return j}
function roleOptions(selected){return Object.keys(roleName).map(role=>`<option value="${role}"${role===selected?' selected':''}>${roleName[role]}</option>`).join('')}
async function load(){try{const j=await api('/api/users');document.querySelector('#rows').innerHTML=j.data.users.length?j.data.users.map(u=>`<tr data-id="${u.id}"><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.displayName)}</td><td><select data-role>${roleOptions(u.role)}</select></td><td class="${u.enabled?'status-enabled':'status-disabled'}">${u.enabled?'启用':'停用'}</td><td class="actions"><button class="secondary" data-action="save-role">保存角色</button><button class="secondary" data-action="password">重置密码</button><button class="${u.enabled?'warn':'primary'}" data-action="enabled" data-enabled="${u.enabled}">${u.enabled?'停用':'启用'}</button></td></tr>`).join(''):'<tr><td class="empty" colspan="5">暂无人员</td></tr>';await loadAudit()}catch(e){document.querySelector('#error').textContent=e.message}}
async function loadAudit(){try{const j=await api('/api/audit');document.querySelector('#audit').innerHTML=j.data.entries.length?j.data.entries.map(e=>`<tr><td>${escapeHtml(e.createdAt)}</td><td>${escapeHtml(e.action)}</td><td class="audit-detail">${escapeHtml(JSON.stringify(e.detail))}</td></tr>`).join(''):'<tr><td class="empty" colspan="3">暂无审计记录</td></tr>'}catch{} }
document.querySelector('#rows').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('tr'),id=row.dataset.id;try{if(b.dataset.action==='enabled')await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.enabled!=='true'})});if(b.dataset.action==='save-role')await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({role:row.querySelector('[data-role]').value})});if(b.dataset.action==='password'){const password=prompt('输入新的临时密码（至少 12 位）');if(password===null)return;if(password.length<12)throw Error('密码至少需要 12 位');await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({password})})}document.querySelector('#error').textContent='';await load()}catch(x){document.querySelector('#error').textContent=x.message}});
document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();document.querySelector('#error').textContent='';try{await api('/api/users',{method:'POST',body:JSON.stringify({email:document.querySelector('#email').value,displayName:document.querySelector('#displayName').value,password:document.querySelector('#password').value,role:document.querySelector('#role').value})});e.target.reset();await load()}catch(x){document.querySelector('#error').textContent=x.message}});
load();
</script>
<script src="/session.js"></script>
</body>
</html>
